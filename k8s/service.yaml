kind: Service
apiVersion: v1
metadata:
  name: gateway-service
  labels:
    app: gateway-service
  namespace: ikomida
  annotations:
    cloud.google.com/backend-config: '{"ports": {"1988":"gateway-backendconfig"}}'
    cloud.google.com/neg: '{"ingress": true}'
spec:
  type: NodePort
  selector:
     app: gateway
  ports:
  - protocol: TCP
    port: 1988
    targetPort: 1988